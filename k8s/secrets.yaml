# Kubernetes Secrets - DO NOT COMMIT ACTUAL VALUES
# In production, use external secrets management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Database Credentials
  DB_USER: 'postgres'
  DB_PASSWORD: 'CHANGE_ME_IN_PRODUCTION'

  # JWT Configuration
  JWT_SECRET: 'CHANGE_ME_IN_PRODUCTION'
  JWT_EXPIRES_IN: '7d'

  # Stripe Configuration
  STRIPE_SECRET_KEY: 'sk_test_CHANGE_ME'
  STRIPE_PUBLISHABLE_KEY: 'pk_test_CHANGE_ME'
  STRIPE_WEBHOOK_SECRET: 'whsec_CHANGE_ME'

  # PayPal Configuration
  PAYPAL_CLIENT_ID: 'CHANGE_ME'
  PAYPAL_CLIENT_SECRET: 'CHANGE_ME'

  # Encryption
  ENCRYPTION_KEY: 'CHANGE_ME_32_CHAR_MINIMUM'
