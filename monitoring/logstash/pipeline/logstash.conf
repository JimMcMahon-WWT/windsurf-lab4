input {
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp"]
  }

  # UDP input for application logs
  udp {
    port => 5000
    codec => json_lines
    tags => ["udp"]
  }

  # Beats input (Filebeat)
  beats {
    port => 5044
    tags => ["beats"]
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # Add service name from container name
  if [container][name] {
    mutate {
      add_field => { "service" => "%{[container][name]}" }
    }
  }

  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Extract log level
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }

  # Geo IP enrichment for security logs
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "development" }
  }

  # Security audit log tagging
  if [audit] {
    mutate {
      add_tag => ["security", "audit"]
    }
  }

  # Error detection and tagging
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_tag => ["error"]
    }
  }

  # Performance log tagging
  if [duration] or [response_time] {
    mutate {
      add_tag => ["performance"]
    }
  }

  # Business metrics tagging
  if [order_id] or [payment_id] or [user_id] {
    mutate {
      add_tag => ["business"]
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "changeme"
  }

  # Debug output (optional - comment out in production)
  stdout {
    codec => rubydebug
  }
}
