filebeat.inputs:
  # Docker container logs
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata:
          host: 'unix:///var/run/docker.sock'
      - decode_json_fields:
          fields: ['message']
          target: ''
          overwrite_keys: true

  # Application log files (if mounted)
  - type: log
    enabled: false
    paths:
      - /var/log/app/*.log
    fields:
      log_type: application
    multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
    multiline.negate: true
    multiline.match: after

# Processors
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_fields:
      target: ''
      fields:
        environment: development
        platform: ecommerce

# Output to Logstash
output.logstash:
  hosts: ['logstash:5044']
  loadbalance: true
  worker: 2

# Output directly to Elasticsearch (alternative - comment out if using Logstash)
# output.elasticsearch:
#   hosts: ["elasticsearch:9200"]
#   indices:
#     - index: "ecommerce-logs-%{+yyyy.MM.dd}"

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# Monitoring
monitoring.enabled: true
monitoring.elasticsearch:
  hosts: ['elasticsearch:9200']
