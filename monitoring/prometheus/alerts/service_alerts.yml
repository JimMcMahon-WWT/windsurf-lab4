groups:
  - name: service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~".*-service"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: 'Service {{ $labels.job }} is down'
          description: 'Service {{ $labels.job }} has been down for more than 1 minute'
          runbook_url: 'https://wiki.example.com/runbooks/service-down'

      - alert: ServiceHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: 'High error rate on {{ $labels.service }}'
          description: 'Error rate is {{ $value | humanizePercentage }} on {{ $labels.service }}'

      - alert: ServiceHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: 'High latency on {{ $labels.service }}'
          description: '95th percentile latency is {{ $value }}s on {{ $labels.service }}'

  - name: infrastructure_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: (rate(container_cpu_usage_seconds_total{job!="cadvisor"}[5m]) * 100) > 500
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: 'High CPU usage on {{ $labels.job }}'
          description: 'Container {{ $labels.job }} CPU usage is {{ $value }}% (>5 cores)'

      - alert: HighMemoryUsage
        expr: (container_spec_memory_limit_bytes > 0) and ((container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 90)
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: 'High memory usage on {{ $labels.name }}'
          description: 'Container {{ $labels.name }} memory usage is {{ $value }}%'

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: 'Low disk space on {{ $labels.device }}'
          description: 'Disk space is below 15% on {{ $labels.device }}'

  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
        annotations:
          summary: 'PostgreSQL is down'
          description: 'PostgreSQL database has been down for more than 1 minute'

      - alert: PostgreSQLHighConnections
        expr: (pg_stat_database_numbackends / pg_settings_max_connections) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: 'High PostgreSQL connections'
          description: 'PostgreSQL is using {{ $value }}% of available connections'

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_statements_mean_exec_time[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: 'Slow PostgreSQL queries detected'
          description: 'Average query execution time is {{ $value }}ms'

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag > 10
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: 'PostgreSQL replication lag detected'
          description: 'Replication lag is {{ $value }} seconds'

  - name: cache_alerts
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: cache
        annotations:
          summary: 'Redis is down'
          description: 'Redis cache has been down for more than 1 minute'

      - alert: RedisHighMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: 'High Redis memory usage'
          description: 'Redis memory usage is {{ $value }}%'

      - alert: RedisLowHitRate
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.7
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: 'Low Redis cache hit rate'
          description: 'Redis cache hit rate is {{ $value | humanizePercentage }}'

  - name: slo_alerts
    interval: 1m
    rules:
      # SLO: 99.9% availability (error budget)
      - alert: ErrorBudgetBurning
        expr: (1 - (rate(http_requests_total{status=~"2.."}[1h]) / rate(http_requests_total[1h]))) > 0.001
        for: 1h
        labels:
          severity: warning
          category: slo
        annotations:
          summary: 'Error budget is burning for {{ $labels.service }}'
          description: 'Error rate {{ $value | humanizePercentage }} exceeds SLO of 99.9%'

      # SLO: 95% of requests < 500ms
      - alert: LatencySLOViolation
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: 'Latency SLO violation on {{ $labels.service }}'
          description: '95th percentile latency {{ $value }}s exceeds 500ms SLO'

  - name: business_metrics_alerts
    interval: 1m
    rules:
      - alert: OrderProcessingStalled
        expr: rate(orders_created_total[5m]) == 0 and rate(orders_created_total[1h] offset 1h) > 0
        for: 10m
        labels:
          severity: critical
          category: business
        annotations:
          summary: 'Order processing has stalled'
          description: 'No orders created in last 5 minutes despite recent activity'

      - alert: HighPaymentFailureRate
        expr: rate(payments_failed_total[5m]) / rate(payments_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: 'High payment failure rate'
          description: 'Payment failure rate is {{ $value | humanizePercentage }}'

      - alert: AbnormalTrafficSpike
        expr: rate(http_requests_total[5m]) > (avg_over_time(rate(http_requests_total[5m])[1h:5m]) * 3)
        for: 5m
        labels:
          severity: warning
          category: traffic
        annotations:
          summary: 'Abnormal traffic spike detected on {{ $labels.service }}'
          description: 'Traffic is 3x higher than normal on {{ $labels.service }}'

  - name: security_alerts
    interval: 30s
    rules:
      - alert: HighAuthenticationFailures
        expr: rate(auth_failures_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: 'High authentication failure rate'
          description: 'Authentication failures: {{ $value }} per second'

      - alert: SuspiciousAPIActivity
        expr: rate(http_requests_total{status="401"}[5m]) > 50
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: 'Suspicious API activity detected'
          description: 'High rate of 401 responses: {{ $value }} per second'

      - alert: RateLimitExceeded
        expr: rate(rate_limit_exceeded_total[5m]) > 100
        for: 5m
        labels:
          severity: info
          category: security
        annotations:
          summary: 'Rate limit frequently exceeded'
          description: 'Rate limit exceeded {{ $value }} times per second'
