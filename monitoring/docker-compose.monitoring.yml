# ============================================================
# ADVANCED MONITORING STACK
#
# This file contains ONLY the additional monitoring services
# not already present in the main docker-compose.yml
#
# Services in main docker-compose.yml:
#   - Prometheus, Grafana, cAdvisor
#   - Postgres-exporter, Redis-exporter
#   - Elasticsearch, Kibana
#
# New services in this file:
#   - Jaeger (distributed tracing)
#   - Logstash (log processing)
#   - Filebeat (log shipping)
#   - Alertmanager (alert routing)
# ============================================================

services:
  # ============================================================
  # DISTRIBUTED TRACING - Jaeger
  # ============================================================

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: ecommerce-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '5775:5775/udp' # Zipkin Thrift
      - '6831:6831/udp' # Jaeger Thrift Compact
      - '6832:6832/udp' # Jaeger Thrift Binary
      - '5778:5778' # Jaeger HTTP
      - '16686:16686' # Jaeger UI
      - '14250:14250' # gRPC
      - '14268:14268' # HTTP
      - '14269:14269' # HTTP Admin
      - '9411:9411' # Zipkin
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    networks:
      - ecommerce-network
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:14269/']
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # LOG PROCESSING - Logstash
  # NOTE: Elasticsearch and Kibana are in main docker-compose.yml
  # ============================================================

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: ecommerce-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - '5000:5000/tcp' # TCP input
      - '5000:5000/udp' # UDP input
      - '5044:5044' # Beats input
      - '9600:9600' # Monitoring API
    networks:
      - ecommerce-network
      - monitoring-network
    restart: unless-stopped
    environment:
      - 'LS_JAVA_OPTS=-Xms256m -Xmx256m'

  # ============================================================
  # LOG SHIPPER - Filebeat (Optional)
  # ============================================================

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.1
    container_name: ecommerce-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    networks:
      - monitoring-network
    depends_on:
      - logstash
    restart: unless-stopped
    command: filebeat -e -strict.perms=false

  # ============================================================
  # ALERT MANAGER (Optional)
  # ============================================================

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: ecommerce-alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    ports:
      - '9094:9093' # Changed host port to 9094 to avoid conflict with Kafka
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  ecommerce-network:
    external: true
  monitoring-network:
    driver: bridge

volumes:
  filebeat-data:
  alertmanager-data:
