global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@ecommerce.com'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'

# Templates for alert formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert distribution
route:
  # Default receiver
  receiver: 'default'

  # Group alerts by labels
  group_by: ['alertname', 'cluster', 'service']

  # Wait before sending initial notification
  group_wait: 10s

  # Wait before sending additional notifications for same group
  group_interval: 10s

  # Wait before resending resolved notification
  repeat_interval: 12h

  # Child routes
  routes:
    # Critical alerts go to PagerDuty
    - match:
        severity: critical
      receiver: 'pagerduty'
      continue: true

    # Database alerts go to DBA team
    - match_re:
        category: database
      receiver: 'dba-team'

    # Security alerts go to security team
    - match:
        category: security
      receiver: 'security-team'

    # Business metrics go to business team
    - match:
        category: business
      receiver: 'business-team'

# Alert inhibition rules (prevent notification spam)
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Inhibit all if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      service: '.*'
    equal: ['service']

# Receiver configurations
receivers:
  - name: 'default'
    email_configs:
      - to: 'ops-team@ecommerce.com'
        headers:
          subject: '{{ .GroupLabels.alertname }} - {{ .Status | toUpper }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <h3>Firing Alerts:</h3>
          {{ range .Alerts.Firing }}
          <ul>
            <li><strong>{{ .Labels.alertname }}</strong></li>
            <li>Service: {{ .Labels.service }}</li>
            <li>Summary: {{ .Annotations.summary }}</li>
            <li>Description: {{ .Annotations.description }}</li>
          </ul>
          {{ end }}

  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: 'your-pagerduty-service-key'
        description: '{{ .GroupLabels.alertname }}'

  - name: 'slack'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'dba-team'
    email_configs:
      - to: 'dba-team@ecommerce.com'

  - name: 'security-team'
    email_configs:
      - to: 'security-team@ecommerce.com'

  - name: 'business-team'
    email_configs:
      - to: 'business-team@ecommerce.com'
